version: '3.8'  

services:
  cleanarchmvc.webui:
    container_name: cleanarchmvc.webui
    image: ${DOCKER_REGISTRY-}cleanarchmvcwebui
    build:
      context: .
      dockerfile: CleanArchMvc.WebUI/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DB_PASSWORD=tetriDev7&
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=cert.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Cert123
    volumes:
      - ~/.aspnet/https:/https
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    networks:
      - cleanarch-network
    depends_on:
      - cleanarchmvc.database
    restart: unless-stopped

  cleanarchmvc.database:
    container_name: cleanarchmvc.database
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "tetriDev7&"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - cleanarch-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -U sa -P $$SA_PASSWORD -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  cleanarch-network:
    driver: bridge

volumes:
  sql_data: